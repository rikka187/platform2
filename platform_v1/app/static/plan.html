<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>路径与方案 · 银犁物流仓配一体化协同平台</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/admin.css">
<style>
  .mapwrap{position:relative;background:linear-gradient(160deg,#f7fbff,#eaf4fb);border:1px solid #e3eef7;border-radius:14px;overflow:hidden}
  canvas{display:block;width:100%;height:520px}
  .maplegend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid #e3eef7;border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.9;box-shadow:0 8px 20px rgba(23,54,93,.10)}
  .maplegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
  .tip{position:absolute;pointer-events:none;background:#0f2740;color:#fff;font-size:12px;padding:7px 10px;border-radius:9px;display:none;max-width:260px;line-height:1.6;z-index:5}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .bars{display:grid;gap:8px}
  .bar-row{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center;font-size:13px}
  .bar-track{height:14px;background:#edf3f8;border-radius:8px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#2367a8,#19a7a0);border-radius:8px}
</style>
</head>
<body>
<div id="app"></div>

<script src="/shell.js"></script>
<script>
(async () => {
  const payload = await Shell.boot('/plan.html', '路径优化与方案生成',
    '方案工作台：客户→批次→趟次 + 路径优化（启发式 / CP-SAT / 智能优化）+ 成本核算 · 地图、月台、充电、导出都在本页');
  if (!payload) return;

  const mount = document.getElementById('pageMount');
  const canRun = Shell.has('plan.run');
  let state = { scope: '姜蒜', scenario: 'S3', solver: 'auto', result: null, compare: null, hover: null };

  mount.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <div class="field" style="min-width:190px"><label>产品品类</label>
          <select id="pScope">
            <option value="全部" selected>全部（两品类联合、共享车辆池）</option>
            <option value="姜蒜">姜蒜（30 客户）</option>
            <option value="鲜面条">鲜面条（30 客户）</option></select></div>
        <div class="field" style="min-width:230px"><label>调度情景</label>
          <select id="pScenario">
            <option value="S0">S0 人工调度基准（现状车队）</option>
            <option value="S1">S1 仅路径优化（现状车队）</option>
            <option value="S2">S2 路径优化 + 车辆新能源（C3 车队）</option>
            <option value="S3" selected>S3 路径优化 + 新能源 + 仓配月台协同（C3 车队）</option>
          </select></div>
        <div class="field" style="min-width:250px"><label>车队口径</label>
          <select id="pFleet">
            <option value="">按情景默认</option>
            <option value="baseline">现状 10 辆（全燃油）</option>
            <option value="c3">C3 参数表 8 辆（6 纯电 + 2 保留燃油）</option>
            <option value="c3_10">C3 替换 10 辆（6 纯电 + 4 保留燃油）</option>
            <option value="c4">C4 升级 10 辆（8 纯电 + 2 保留燃油）</option>
          </select></div>
        <div class="field" style="min-width:230px"><label>求解方式</label>
          <select id="pSolver">
            <option value="alns" selected>智能路径优化（节约法 + 自适应大邻域搜索）</option>
            <option value="auto">自动（优先 CP-SAT，出月台/装车时序）</option>
            <option value="heuristic">仅启发式</option><option value="cpsat">仅 CP-SAT</option></select></div>
        <div class="field" style="min-width:210px"><label>数据口径</label>
          <select id="pProfile">
            <option value="paper" selected>标准算例（基准口径）</option>
            <option value="case2">实际业务数据</option></select></div>
        <div class="field" style="min-width:190px"><label>发车时刻策略</label>
          <select id="pPolicy">
            <option value="ready" selected>按批次起送（与原程序一致）</option>
            <option value="optimise">窗口内优化（成本更低）</option></select></div>
        <button class="btn primary" id="btnRun" ${canRun ? '' : 'disabled'}>生成方案</button>
        <button class="btn" id="btnCompare">S0→S3 情景对比</button>
        <button class="btn" id="btnFleetEval">C0/C3/C4 车队对比</button>
        <button class="btn" id="btnCsvTrip">导出趟次明细 CSV</button>
        <button class="btn" id="btnCsvKpi">导出 KPI 报表 CSV</button>
        <span class="muted" id="runHint"></span>
      </div>
      <div id="kpis" class="grid k4"></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>配送网络与路线（离线自绘 · Haversine 距离）</h3>
        <span class="muted" id="mapHint">方块＝配送中心，圆点＝客户（按批次着色），折线＝趟次路线</span></div>
      <div class="mapwrap">
        <canvas id="map"></canvas>
        <div class="maplegend" id="legend"></div>
        <div class="tip" id="tip"></div>
      </div>
    </div>

    <div class="grid k2">
      <div class="card"><div class="card-head"><h3>成本构成</h3></div><div class="bars" id="costBars"></div></div>
      <div class="card"><div class="card-head"><h3>多情景评价摘要</h3><span class="muted" id="cmpHint">点上方「S0→S3 情景对比」；五维评分与雷达图见<a href="/scenarios.html">多情景评价</a></span></div><div id="compare"></div></div>
    </div>

    <div class="card"><div class="card-head"><h3>趟次计划</h3><span class="muted" id="tripHint"></span></div><div id="trips"></div></div>
    <div class="card"><div class="card-head"><h3>仓配月台协同</h3>
      <span class="muted" id="dockHint">备货反推 → 月台预约 → 装车时序 → 冲突提示（03:00-12:00）</span></div>
      <div id="docks"></div></div>
    <div class="grid k2">
      <div class="card"><div class="card-head"><h3>装车与月台时序</h3></div><div id="schedule"></div></div>
      <div class="card"><div class="card-head"><h3>新能源充电排班</h3><span class="muted">谷段 01:00-07:00 · 3×120kW</span></div><div id="charging"></div></div>
    </div>
    <div class="card"><div class="card-head"><h3>提示与告警</h3></div><div id="warnings"></div></div>`;

  const el = id => document.getElementById(id);
  const canvas = el('map');
  const ctx = canvas.getContext('2d');

  function fitCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(600, rect.width * ratio);
    canvas.height = 520 * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }

  function project(lon, lat, bounds, w, h, pad) {
    const [minLon, minLat, maxLon, maxLat] = bounds;
    const spanLon = Math.max(1e-6, maxLon - minLon), spanLat = Math.max(1e-6, maxLat - minLat);
    const kx = (w - pad * 2) / spanLon, ky = (h - pad * 2) / spanLat;
    const k = Math.min(kx, ky) * (1 / Math.cos((minLat + maxLat) / 2 * Math.PI / 180) > 0 ? 1 : 1);
    return [pad + (lon - minLon) * k, h - pad - (lat - minLat) * k];
  }

  const PALETTE = ['#2367a8', '#19a7a0', '#c46a1f', '#7b4fb5', '#c0392b', '#0f7b6c',
                   '#2f6f4f', '#a52a6e', '#3b6ea5', '#8a6d1f', '#4a5568', '#1f7a8c'];

  function draw() {
    const result = state.result;
    const w = canvas.clientWidth || 900, h = 520;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#f9fcff';
    ctx.fillRect(0, 0, w, h);
    if (!result || !result.customers || !result.customers.length) {
      ctx.fillStyle = '#8595a8'; ctx.font = '14px "Microsoft YaHei",sans-serif';
      ctx.fillText('还没有方案：选择情景后点「生成方案」', 24, 40);
      return;
    }
    const lons = result.customers.map(c => c.lon).concat([result.dc.lon]);
    const lats = result.customers.map(c => c.lat).concat([result.dc.lat]);
    const bounds = [Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats)];
    const pad = 34;

    // 网格
    ctx.strokeStyle = '#e7f0f7'; ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
      const x = pad + (w - pad * 2) * i / 6, y = pad + (h - pad * 2) * i / 6;
      ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, h - pad); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
    }

    const batches = [...new Set(result.customers.map(c => c.batch_code || '未分批'))].sort();
    const byCode = {};
    result.customers.forEach(c => { byCode[c.code] = c; });

    // 路线
    (result.trips || []).forEach((trip, index) => {
      const color = PALETTE[index % PALETTE.length];
      const points = [project(result.dc.lon, result.dc.lat, bounds, w, h, pad)];
      (trip.sequence || []).forEach(stop => {
        const customer = byCode[stop.code];
        if (customer) points.push(project(customer.lon, customer.lat, bounds, w, h, pad));
      });
      points.push(project(result.dc.lon, result.dc.lat, bounds, w, h, pad));
      ctx.strokeStyle = color; ctx.globalAlpha = 0.75;
      ctx.lineWidth = trip.infeasible ? 2.5 : 1.8;
      if (trip.infeasible) ctx.setLineDash([6, 4]);
      ctx.beginPath();
      points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    });

    // 客户点
    result.customers.forEach(customer => {
      const [x, y] = project(customer.lon, customer.lat, bounds, w, h, pad);
      const bidx = batches.indexOf(customer.batch_code || '未分批');
      ctx.fillStyle = PALETTE[bidx % PALETTE.length];
      ctx.beginPath(); ctx.arc(x, y, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
      if (state.hover && state.hover.code === customer.code) {
        ctx.strokeStyle = '#102a43'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = '#5b6b7c'; ctx.font = '10px "Microsoft YaHei",sans-serif';
      ctx.fillText(customer.code, x + 6, y - 5);
    });

    // 配送中心
    const [dx, dy] = project(result.dc.lon, result.dc.lat, bounds, w, h, pad);
    ctx.fillStyle = '#102a43';
    ctx.fillRect(dx - 7, dy - 7, 14, 14);
    ctx.fillStyle = '#102a43'; ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
    ctx.fillText('配送中心 0', dx + 11, dy + 4);

    el('legend').innerHTML = batches.map((batch, i) =>
      `<div><i style="background:${PALETTE[i % PALETTE.length]}"></i>${batch}</div>`).join('') +
      `<div class="muted">共 ${result.customers.length} 个客户 · ${(result.trips || []).length} 趟次</div>`;
  }

  canvas.addEventListener('mousemove', event => {
    const result = state.result;
    if (!result || !result.customers) return;
    const rect = canvas.getBoundingClientRect();
    const mx = event.clientX - rect.left, my = event.clientY - rect.top;
    const w = canvas.clientWidth || 900, h = 520, pad = 34;
    const lons = result.customers.map(c => c.lon).concat([result.dc.lon]);
    const lats = result.customers.map(c => c.lat).concat([result.dc.lat]);
    const bounds = [Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats)];
    let best = null, bestDist = 14;
    result.customers.forEach(customer => {
      const [x, y] = project(customer.lon, customer.lat, bounds, w, h, pad);
      const dist = Math.hypot(x - mx, y - my);
      if (dist < bestDist) { bestDist = dist; best = customer; }
    });
    const tip = el('tip');
    if (best) {
      state.hover = best;
      tip.style.display = 'block';
      tip.style.left = Math.min(mx + 14, w - 270) + 'px';
      tip.style.top = (my + 14) + 'px';
      const win = t => t == null ? '-' : Shell.fmtTime(t);
      tip.innerHTML = `<b>客户 ${best.code}</b> ${best.name || ''}<br>` +
        `需求 ${Number(best.total_kg).toFixed(1)} kg / ${Number(best.total_m3).toFixed(3)} m³<br>` +
        `期望窗 ${win(best.exp_start)}-${win(best.exp_end)}　可接受 ${win(best.acc_start)}-${win(best.acc_end)}<br>` +
        `服务 ${best.service_min} 分钟 · 批次 ${best.batch_code || '未分批'}<br>` +
        `坐标 ${Number(best.lon).toFixed(2)}, ${Number(best.lat).toFixed(2)}`;
      draw();
    } else if (state.hover) {
      state.hover = null; tip.style.display = 'none'; draw();
    }
  });
  canvas.addEventListener('mouseleave', () => { el('tip').style.display = 'none'; state.hover = null; draw(); });

  function renderKpis() {
    const r = state.result;
    if (!r) { el('kpis').innerHTML = '<div class="empty">尚未生成方案</div>'; return; }
    const k = r.kpi;
    el('kpis').innerHTML = `
      <div class="stat"><b>${k.delivery_cost ? '日总配送成本' : '日总成本'}</b><strong>${k.delivery_cost || k.total_cost} 元</strong><small>${k.delivery_cost ? '配送成本口径：出车 + 里程 + 制冷 + 时间窗惩罚' : r.scenario_label}</small></div>
      <div class="stat"><b>综合成本</b><strong>${k.total_cost} 元</strong><small>含维护 / 货损 / 能耗 · 碳排 ${k.carbon_kg} kg</small></div>
      <div class="stat"><b>准时率</b><strong>${k.on_time_rate}%</strong><small>${k.on_time_customers}/${k.customers} 个客户</small></div>
      <div class="stat"><b>总里程 / 趟次</b><strong>${k.total_distance_km} km</strong><small>${k.trips} 趟次 · 用车 ${k.used_vehicles} 辆</small></div>
      <div class="stat"><b>碳排放</b><strong>${k.carbon_kg} kg</strong><small>装载率 ${k.avg_load_rate}% · 利用率 ${k.vehicle_utilization}%</small></div>`;
    el('runHint').textContent = `求解器：${r.solver_label || r.solver || '-'}`
    + `${r.solver_status ? '（' + r.solver_status + '）' : ''} · 车队 ${r.fleet_label || r.fleet_tag}`
    + `${r.profile ? ' · 数据口径 ' + (r.profile === 'paper' ? '标准算例' : '实际业务数据') : ''}`;
  }

  function renderCost() {
    const r = state.result;
    if (!r) { el('costBars').innerHTML = ''; return; }
    const k = r.kpi;
    const items = [['运输成本', k.transport_cost], ['制冷成本', k.reefer_cost], ['能耗成本', k.energy_cost],
                   ['货损成本', k.loss_cost], ['时间窗惩罚', k.penalty_cost], ['维护成本', k.maintenance_cost]];
    const max = Math.max(...items.map(i => i[1]), 1);
    el('costBars').innerHTML = items.map(([label, value]) => `
      <div class="bar-row"><span>${label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(value / max * 100).toFixed(1)}%"></div></div>
        <span style="text-align:right">${value} 元</span></div>`).join('') +
      `<div class="muted" style="margin-top:8px">早到 ${k.early_hours} 小时（5 元/h）· 晚到 ${k.late_hours} 小时（15 元/h）·
        能耗合计 ${k.energy_total}（燃油 L / 电力 kWh）</div>`;
  }

  function renderTrips() {
    const r = state.result;
    if (!r) { el('trips').innerHTML = ''; el('tripHint').textContent = ''; return; }
    const columns = [
      { title: '趟次', render: t => `<b>${t.trip_id}</b>` },
      { title: '批次', key: 'batch_id' },
      { title: '客户顺序', render: t => t.customer_codes.map((code, i) =>
          `${i + 1}. ${code}`).join(' → ') },
      { title: '装载', render: t => `${t.load_kg} kg / ${t.volume_m3} m³` },
      { title: '装载率', render: t => `<span class="tag ${t.load_rate >= 70 ? 'ok' : (t.load_rate >= 40 ? 'warn' : 'grey')}">${t.load_rate}%</span>` },
      { title: '里程', render: t => `${t.distance_km} km` },
      { title: '时长', render: t => `${Math.round(t.duration_min)} 分` },
      { title: '发车', render: t => Shell.fmtTime(t.planned_departure_min) },
      { title: '车辆', render: t => `${t.vehicle_code || '-'}<div class="muted" style="font-size:11px">${t.vehicle_type || ''} · ${t.energy_type || ''}</div>` },
      { title: '备注', render: t => t.infeasible ? '<span class="tag bad">不可行待人工</span>' : '' }
    ];
    el('trips').innerHTML = Shell.table(columns, r.trips);
    const s = r.summary;
    el('tripHint').textContent = `服务 ${s.served_customers}/${s.customers} 客户 · 合计 ${s.total_kg} kg / ${s.total_m3} m³ · 平均装载率 ${s.avg_load_rate}%`;
  }

  function renderSchedule() {
    const r = state.result;
    if (!r || !r.schedule || !r.schedule.length) { el('schedule').innerHTML = '<div class="empty">暂无</div>'; return; }
    const columns = [
      { title: '趟次', render: s => s.trip_id },
      { title: '车辆', render: s => s.vehicle_id },
      { title: '月台', render: s => `<span class="tag info">${s.dock_id}</span>` },
      { title: '备货完成', render: s => Shell.fmtTime(s.prep_end) },
      { title: '开始装车', render: s => Shell.fmtTime(s.load_start) },
      { title: '装车完成', render: s => Shell.fmtTime(s.load_end) },
      { title: '发车', render: s => `<b>${Shell.fmtTime(s.depart)}</b>` },
      { title: '等待(分)', render: s => s.wait_min }
    ];
    el('schedule').innerHTML = Shell.table(columns, r.schedule);
  }

  function renderDocks() {
    const r = state.result;
    const plan = r && r.dock_plan;
    if (!plan || !plan.entries || !plan.entries.length) {
      el('docks').innerHTML = '<div class="empty">暂无月台协同数据</div>';
      el('dockHint').textContent = '';
      return;
    }
    const s = plan.summary;
    el('dockHint').textContent = `${s.trips} 个装车任务 · 使用 ${s.docks_used}/${s.dock_count} 个月台 · ` +
      `平均等待 ${s.avg_wait_min} 分钟（最长 ${s.max_wait_min}）· 冲突 ${s.conflicts}（严重 ${s.errors}）`;
    const dockCards = (plan.docks || []).map(dock => `
      <div class="stat" style="margin-bottom:10px">
        <b>${dock.dock_code}${dock.overbooked ? ' <span class="tag bad">超配</span>' : ''}</b>
        <strong>${dock.trips} 趟 · ${dock.utilization}%</strong>
        <small>${dock.intervals.map(i => `${Shell.fmtTime(i.start)}-${Shell.fmtTime(i.end)} ${i.trip_id}`).join('　')}</small>
      </div>`).join('');
    const conflictBox = (plan.conflicts || []).length
      ? plan.conflicts.map(c => `<div class="banner ${c.level === 'error' ? 'bad' : 'info'}">
          <b>${c.type}</b>：${Shell.escapeHtml(c.message)}<br><span class="muted">建议：${Shell.escapeHtml(c.suggestion || '')}</span></div>`).join('')
      : '<div class="banner ok">✓ 月台无冲突：备货均在装车前完成、装车均早于发车、无月台/车辆时间重叠</div>';
    const rows = plan.entries.map(e => ({
      trip_id: e.trip_id, dock_code: e.dock_code, vehicle_code: e.vehicle_code,
      prep: `${Shell.fmtTime(e.prep_start)}-${Shell.fmtTime(e.prep_end)}`,
      load: `${Shell.fmtTime(e.load_start)}-${Shell.fmtTime(e.load_end)}`,
      depart: Shell.fmtTime(e.depart), wait: e.wait_min
    }));
    const columns = [
      { title: '趟次', key: 'trip_id' },
      { title: '月台', render: x => `<span class="tag info">${x.dock_code}</span>` },
      { title: '车辆', key: 'vehicle_code' },
      { title: '备货（反推）', key: 'prep' },
      { title: '装车', key: 'load' },
      { title: '发车', render: x => `<b>${x.depart}</b>` },
      { title: '等待(分)', key: 'wait' }
    ];
    el('docks').innerHTML = `<div class="grid k3" style="margin-bottom:12px">${dockCards}</div>` +
      conflictBox + '<div style="margin-top:12px">' + Shell.table(columns, rows) + '</div>';
  }

  function renderCharging() {
    const r = state.result;
    const plan = r && r.charging_plan;
    if (!plan || !plan.sessions || !plan.sessions.length) {
      el('charging').innerHTML = '<div class="empty">当前车队无需充电计划（未启用纯电车）</div>';
      return;
    }
    const s = plan.summary;
    const columns = [
      { title: '车辆', key: 'vehicle_code' },
      { title: '充电桩', render: c => c.charger_code },
      { title: '时段', render: c => `${c.start}-${c.end}${c.in_valley ? '' : ' <span class="tag bad">超谷段</span>'}` },
      { title: '电量', render: c => `${c.energy_kwh} kWh` },
      { title: '电费', render: c => `${c.cost_yuan} 元` },
      { title: '碳排', render: c => `${c.carbon_kg} kg` }
    ];
    el('charging').innerHTML =
      `<div class="muted" style="margin-bottom:8px">${s.ev_count} 辆纯电车 · ${s.sessions} 次充电 ·
        合计 ${s.total_kwh} kWh / ${s.total_cost} 元 / ${s.total_carbon} kgCO₂（谷段 ${plan.valley_window}，${plan.charger_count} 桩 × ${plan.charger_power_kw} kW）</div>` +
      Shell.table(columns, plan.sessions) +
      ((plan.conflicts || []).length
        ? plan.conflicts.map(c => `<div class="banner bad" style="margin-top:8px"><b>${c.type}</b>：${Shell.escapeHtml(c.message)}</div>`).join('')
        : '<div class="banner ok" style="margin-top:8px">✓ 全部充电时段落在谷段、桩位无重叠、均早于发车</div>');
  }

  function renderWarnings() {
    const r = state.result;
    if (!r || !r.warnings || !r.warnings.length) { el('warnings').innerHTML = '<div class="empty">没有告警</div>'; return; }
    el('warnings').innerHTML = r.warnings.map(w =>
      `<div class="banner ${w.level === 'error' ? 'bad' : (w.level === 'warn' ? 'bad' : 'info')}">${Shell.escapeHtml(w.message)}</div>`).join('');
  }

  function renderCompare() {
    const data = state.compare;
    if (!data) { el('compare').innerHTML = '<div class="empty">尚未对比</div>'; return; }
    const columns = [
      { title: '情景', render: i => `<b>${i.scenario}</b><div class="muted" style="font-size:11px">${i.label}</div>` },
      { title: '总成本', render: i => `${i.kpi.total_cost} 元` },
      { title: '准时率', render: i => `${i.kpi.on_time_rate}%` },
      { title: '碳排', render: i => `${i.kpi.carbon_kg} kg` },
      { title: '里程', render: i => `${i.kpi.total_distance_km} km` },
      { title: '装载率', render: i => `${i.kpi.avg_load_rate}%` },
      { title: '较基准', render: i => i.vs_baseline
          ? `<span class="tag ${i.vs_baseline.cost_saving >= 0 ? 'ok' : 'bad'}">成本 ${i.vs_baseline.cost_saving >= 0 ? '↓' : '↑'}${Math.abs(i.vs_baseline.cost_saving)} 元</span>
             <span class="tag ok">碳 ↓${Math.abs(i.vs_baseline.carbon_saving)} kg</span>` : '<span class="tag grey">基准</span>' }
    ];
    el('compare').innerHTML = Shell.table(columns, data.items);
    el('cmpHint').textContent = `${data.scope} · 求解器 ${data.solver}`;
  }

  async function run() {
    if (!canRun) { Shell.toast('当前角色没有生成方案的权限', 'err'); return; }
    el('btnRun').disabled = true; el('btnRun').textContent = '计算中…';
    try {
      state.result = await Shell.api('/api/plan/run', { method: 'POST', body: {
        scenario: el('pScenario').value, scope: el('pScope').value, solver: el('pSolver').value,
        fleet: el('pFleet').value,
        profile: el('pProfile').value, departure_policy: el('pPolicy').value,
        restarts: 3, iterations: 1500 } });
      renderAll();
      Shell.toast(`方案已生成：${state.result.summary.trips} 趟次，总成本 ${state.result.kpi.total_cost} 元`, 'ok');
    } catch (e) {
      Shell.toast(e.message, 'err');
    } finally {
      el('btnRun').disabled = false; el('btnRun').textContent = '生成方案';
    }
  }

  async function compare() {
    el('btnCompare').disabled = true; el('btnCompare').textContent = '对比中…';
    try {
      state.compare = await Shell.api('/api/plan/compare', { method: 'POST', body: {
        scope: el('pScope').value, solver: el('pSolver').value, fleet: el('pFleet').value } });
      renderCompare();
      Shell.toast('S0→S3 情景对比已完成', 'ok');
    } catch (e) {
      Shell.toast(e.message, 'err');
    } finally {
      el('btnCompare').disabled = false; el('btnCompare').textContent = 'S0→S3 情景对比';
    }
  }

  function renderAll() { renderKpis(); renderCost(); renderTrips(); renderSchedule(); renderCharging(); renderWarnings(); draw(); }

  async function download(kind) {
    if (!state.result || !state.result.run_id) { Shell.toast('先生成一次方案再导出', 'err'); return; }
    try {
      const data = await Shell.api(`/api/plan/runs/${state.result.run_id}/export?kind=${kind}`);
      const blob = new Blob([data.content], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = data.filename;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
      Shell.toast(`已导出 ${data.filename}`, 'ok');
    } catch (e) { Shell.toast(e.message, 'err'); }
  }

  el('btnCsvTrip').addEventListener('click', () => download('trip'));
  el('btnCsvKpi').addEventListener('click', () => download('kpi'));
  el('btnRun').addEventListener('click', run);
  el('btnCompare').addEventListener('click', compare);
  el('pScope').addEventListener('change', () => { state.result = null; state.compare = null; renderAll(); renderCompare(); });
  window.addEventListener('resize', fitCanvas);

  // 首次进入：若有历史方案则回放最后一次
  try {
    const latest = await Shell.api('/api/plan/latest');
    if (latest && latest.run_id) {
      state.result = latest;
      el('pScope').value = latest.scope; el('pScenario').value = latest.scenario;
      renderAll();
      Shell.toast(`已回放最近一次方案 #${latest.run_id}`, '');
    }
  } catch (e) { /* 无历史 */ }
  fitCanvas();
  if (!state.result) renderAll();
})();
</script>
</body>
</html>
