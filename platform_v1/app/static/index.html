<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>调度驾驶舱 · 银犁物流仓配一体化协同平台</title>
<meta name="description" content="银犁物流城市冷链仓配一体化协同平台：客户与批次、路径优化、车辆新能源、备货月台协同、多情景评价与执行监控。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="app"></div>
<script src="/shell.js"></script>
<script>
(async () => {
  /* 主页：关键指标概览 + 模块入口 + 此刻运行状态。
   * 方案生成/对比、地图、月台协同、充电排班都在「路径与方案」与「多情景评价」页，
   * 主页只做汇总与跳转，避免与那两页功能重复。 */
  const payload = await Shell.boot('/', '调度驾驶舱', '平台概览 · 关键指标、模块入口与此刻运行状态');
  if (!payload) return;

  const mount = document.getElementById('pageMount');
  const canRun = Shell.has('plan.run');
  mount.innerHTML = `
    <div class="card">
      <div class="hero">
        <div>
          <h1>银犁物流城市冷链仓配一体化协同平台</h1>
          <div class="muted">城市冷链仓配协同调度 · 中央配送中心（104.26, 30.85）</div>
          <div class="facts">
            <span class="tag info">Haversine R=6371.0 km</span>
            <span class="tag info">成本口径 出车 + 里程 + 制冷 + 时间窗</span>
            <span class="tag info">载重 + 容积双约束</span>
            <span class="tag ok" id="geoTag">距离校核中…</span>
          </div>
        </div>
        <div class="bigtime">
          <b id="heroTime">--:--:--</b>
          <span id="heroDate">—</span>
          <div class="acts">
            <a class="btn primary" href="/plan.html">${canRun ? '生成调度方案' : '查看方案'}</a>
            <a class="btn" href="/scenarios.html">S0→S3 情景评价</a>
            <a class="btn" href="/monitor.html">执行监控</a>
          </div>
        </div>
      </div>
    </div>

    <div class="card"><div class="card-head"><h3>最近方案关键指标</h3>
      <span class="muted" id="latestHint">读取中…</span></div>
      <div class="grid k4" id="latestKpi"><div class="empty">读取中…</div></div></div>

    <div class="card"><div class="card-head"><h3>基础数据概览</h3>
      <span class="muted">改动客户/车辆数据后，请到「路径与方案」重新生成方案</span></div>
      <div class="grid k4" id="dataKpi"><div class="empty">读取中…</div></div></div>

    <div class="card"><div class="card-head"><h3>功能模块</h3><span class="muted" id="entryHint"></span></div>
      <div class="entries" id="entries"></div></div>

    <div class="grid k2">
      <div class="card"><div class="card-head"><h3>此刻运行状态</h3>
        <span class="muted" id="nowHint">按平台当前时刻取最近方案的执行快照</span></div>
        <div id="now"></div></div>
      <div class="card"><div class="card-head"><h3>最近方案记录</h3>
        <span class="muted">点击「路径与方案」可回放任一方案</span></div>
        <div id="history"></div></div>
    </div>

    <div class="card"><div class="card-head"><h3>平台决策链</h3><span class="muted">从客户订单到执行评价的闭环</span></div>
      <div class="chain">
        <a href="/customers.html">① 客户与批次</a><span class="arrow">→</span>
        <a href="/plan.html">② 路径优化与趟次</a><span class="arrow">→</span>
        <a href="/vehicles.html">③ 车辆与新能源</a><span class="arrow">→</span>
        <a href="/plan.html">④ 备货月台与装车</a><span class="arrow">→</span>
        <a href="/scenarios.html">⑤ 多情景评价</a><span class="arrow">→</span>
        <a href="/monitor.html">⑥ 执行监控与预警</a>
      </div>
      <div class="muted" style="margin-top:10px">
        口径：距离 Haversine（R=6371.0 km，2 位小数）；行驶时间 = 里程 ÷ 40 km/h；
        成本 = 运输（出车固定 + 里程）+ 制冷（8.5 / 10 元·h⁻¹）+ 时间窗惩罚（早到 5 / 晚到 15 元·h⁻¹）
        + 货损（配送 0.008 + 服务 0.0016 × 货值）+ 能耗（谷段电价 0.256 元/kWh、柴油 6.5 元/L）；
        碳排按燃油 2.63 kg/L、电网 0.1564 kg/kWh 折算。
      </div>
    </div>`;

  const el = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function tickHero() {
    const now = new Date();
    el('heroTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    el('heroDate').textContent =
      `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${days[now.getDay()]} · ` +
      Shell.shiftLabel(now.getHours());
  }
  tickHero();
  setInterval(() => { if (!document.hidden) tickHero(); }, 1000);

  const ENTRIES = [
    { href: '/plan.html', icon: '🧭', label: '路径与方案', desc: '客户→批次→趟次、离线地图、月台、充电、KPI 与 CSV 导出', perm: 'plan.view' },
    { href: '/scenarios.html', icon: '📈', label: '多情景评价', desc: 'S0-S3 五维评分、雷达图与边际效益', perm: 'scenarios.view' },
    { href: '/monitor.html', icon: '🛰️', label: '监控反馈', desc: '位置/厢温/电量/月台占用模拟流与预警处置', perm: 'monitor.view' },
    { href: '/customers.html', icon: '📍', label: '客户管理', desc: '客户主数据、时间窗、批次与距离校核', perm: 'customers.view' },
    { href: '/vehicles.html', icon: '🚚', label: '车辆管理', desc: '车辆参数与车队口径配置', perm: 'vehicles.view' },
    { href: '/params.html', icon: '⚙️', label: '参数设置', desc: '成本系数、时间窗惩罚、电价与碳排因子', perm: 'vehicles.view' },
    { href: '/users.html', icon: '👥', label: '用户与留痕', desc: '角色权限、口令重置与操作审计', perm: 'users.manage' },
    { href: '/plan.html', icon: '🏭', label: '月台协同', desc: '备货反推、月台预约、装车时序与冲突提示', perm: 'docks.view' }
  ];
  const usable = ENTRIES.filter(item => Shell.has(item.perm));
  el('entries').innerHTML = usable.map(item =>
    `<a class="entry" href="${item.href}"><span class="ico">${item.icon}</span>
      <b>${item.label}</b><small>${item.desc}</small></a>`).join('');
  el('entryHint').textContent = `${usable.length} 个模块可用`;

  function stat(label, value, small) {
    return `<div class="stat"><b>${label}</b><strong>${value}</strong><small>${small || ''}</small></div>`;
  }

  // ---- 基础数据概览 ----
  (async () => {
    const [customers, vehicles, params, geo] = await Promise.allSettled([
      Shell.api('/api/customers?limit=500'), Shell.api('/api/vehicles'),
      Shell.api('/api/params'), Shell.api('/api/geo/check')]);
    const customerItems = customers.status === 'fulfilled' ? (customers.value.items || []) : [];
    const vehicleItems = vehicles.status === 'fulfilled' ? (vehicles.value.items || []) : [];
    const paramItems = params.status === 'fulfilled'
      ? (params.value.items || params.value.params || []) : [];
    const geoData = geo.status === 'fulfilled' ? geo.value : null;
    const kg = customerItems.reduce((sum, c) => sum + Number(c.total_kg || 0), 0);
    const m3 = customerItems.reduce((sum, c) => sum + Number(c.total_m3 || 0), 0);
    const fleets = new Set(vehicleItems.map(v => v.fleet_tag));
    el('dataKpi').innerHTML =
      stat('客户', `${customerItems.length} 个`, `合计需求 ${kg.toFixed(1)} kg / ${m3.toFixed(3)} m³`) +
      stat('车辆', `${vehicleItems.length} 辆`,
        `${fleets.size} 种车队口径 · 纯电 ${vehicleItems.filter(v => v.energy_type === '纯电').length} 辆`) +
      stat('参数', `${paramItems.length} 项`, '成本系数与运行口径') +
      stat('距离校核', geoData && geoData.consistent ? '逐格一致' : '待检查',
        geoData ? `Haversine R=${geoData.radius_km} km / ${geoData.digits} 位小数` : '校核接口不可用');
    const geoTag = el('geoTag');
    if (geoData && geoData.consistent) {
      geoTag.className = 'tag ok';
      geoTag.textContent = '距离矩阵逐格一致';
    } else if (geoData) {
      geoTag.className = 'tag bad';
      geoTag.textContent = '距离矩阵与既有矩阵不一致';
    } else {
      geoTag.className = 'tag grey';
      geoTag.textContent = '距离校核不可用';
    }
  })();

  // ---- 最近方案 + 此刻运行状态 ----
  (async () => {
    let latest = null;
    try {
      latest = await Shell.api('/api/plan/latest');
    } catch (e) { latest = null; }
    if (!latest || !latest.run_id) {
      el('latestKpi').innerHTML = '<div class="empty">还没有生成过方案。' +
        (canRun ? '点右上角「生成调度方案」或左侧「路径与方案」开始。' : '请联系调度员生成方案。') + '</div>';
      el('latestHint').textContent = '尚无记录';
      el('now').innerHTML = '<div class="empty">没有方案，无法取执行快照</div>';
      return;
    }
    const kpi = latest.kpi || {};
    el('latestKpi').innerHTML =
      stat('日总成本', `${kpi.total_cost} 元`, `${latest.scenario_label || latest.scenario} · 车队 ${latest.fleet_tag}`) +
      stat('准时率', `${kpi.on_time_rate}%`, `${kpi.on_time_customers}/${kpi.customers} 个客户`) +
      stat('总里程 / 趟次', `${kpi.total_distance_km} km`, `${kpi.trips} 趟次 · 用车 ${kpi.used_vehicles} 辆`) +
      stat('碳排放', `${kpi.carbon_kg} kg`, `装载率 ${kpi.avg_load_rate}% · 利用率 ${kpi.vehicle_utilization}%`);
    el('latestHint').innerHTML = `方案 #${latest.run_id} · ${latest.scope} · ${Shell.escapeHtml(latest.solver || '')} · ` +
      `${Shell.escapeHtml(latest.created_at || '')}　<a href="/plan.html">查看详情</a>`;

    try {
      const snap = await Shell.api(`/api/monitor/state?run_id=${latest.run_id}&tick=${Shell.nowMinutes()}`);
      const summary = snap.summary;
      const alerts = (snap.alerts || []).slice(0, 3);
      el('nowHint').textContent = `方案 #${latest.run_id} 在 ${Shell.fmtTime(snap.tick)} 的快照`;
      el('now').innerHTML = `
        <div class="grid k3" style="margin-bottom:10px">
          ${stat('在途 / 待发 / 完成', `${summary.in_transit} / ${summary.waiting} / ${summary.finished}`, `共 ${summary.vehicles} 辆车`)}
          ${stat('月台占用', `${summary.docks_occupied} / ${summary.docks_total}`, `空闲 ${summary.docks_idle} 个`)}
          ${stat('最差状态', summary.worst_status,
            `预警 ${summary.alerts['一级提示'] || 0} 提示 / ${summary.alerts['二级警告'] || 0} 警告 / ${summary.alerts['三级严重'] || 0} 严重`)}
        </div>` + (alerts.length
          ? alerts.map(a => `<div class="banner ${a.level === 3 ? 'bad' : 'info'}">
              <b>${a.level_text} · ${a.metric}</b>：${Shell.escapeHtml(a.detail)}
              <span class="muted">（建议：${Shell.escapeHtml(a.suggestion)}）</span></div>`).join('')
          : '<div class="banner ok">✓ 该时刻没有预警</div>') +
        '<div style="margin-top:8px"><a class="btn sm" href="/monitor.html">进入监控反馈 →</a></div>';
    } catch (e) {
      el('now').innerHTML = `<div class="empty">无法获取执行快照：${Shell.escapeHtml(e.message)}</div>`;
    }
  })();

  // ---- 最近方案记录 ----
  (async () => {
    try {
      const data = await Shell.api('/api/plan/runs?limit=8');
      const columns = [
        { title: '编号', render: r => '#' + r.id },
        { title: '情景', render: r => `<b>${r.scenario}</b><div class="muted" style="font-size:11px">${r.scenario_label || ''}</div>` },
        { title: '品类 / 车队', render: r => `${r.scope} / ${r.fleet_tag}` },
        { title: '成本(元)', render: r => r.kpi.total_cost },
        { title: '准时率', render: r => r.kpi.on_time_rate + '%' },
        { title: '碳排(kg)', render: r => r.kpi.carbon_kg },
        { title: '生成时间', render: r => Shell.escapeHtml(r.created_at || '') },
        { title: '操作人', render: r => Shell.escapeHtml(r.created_by || '') }
      ];
      el('history').innerHTML = Shell.table(columns, data.items || []);
    } catch (e) {
      el('history').innerHTML = `<div class="empty">无法读取历史：${Shell.escapeHtml(e.message)}</div>`;
    }
  })();
})();
</script>
</body>
</html>
