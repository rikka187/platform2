# =============================================================================
# 银犁物流仓配一体化协同平台 —— 宝塔面板 Nginx 站点配置（整段替换用）
#
# 【怎么用】
#   方式 A（推荐，最小改动）：
#     宝塔面板 → 网站 → 找到你的站点 → 设置 → 反向代理 → 添加反向代理
#       代理名称：platform    目标 URL：http://127.0.0.1:8787
#       发送域名：$host
#     然后回到【配置文件】，删除或注释掉面板默认的这两行正则 location，
#     否则 /app.js、/styles.css 会被 Nginx 直接从磁盘找文件而 404：
#       location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { ... }
#       location ~ .*\.(js|css)?$ { ... }
#
#   方式 B（本文件）：
#     复制本文件内容 → 网站 → 设置 → 配置文件 → 整体覆盖 → 保存。
#     注意：覆盖会丢掉面板已生成的 #SSL-START ... #SSL-END 区块，
#     所以请“先覆盖本配置，再回面板申请/开启 SSL”，让面板重新写入证书段。
#
# 【端口】__PORT__   【项目目录】__APP_DIR__
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 所有请求都交给 Python 服务，静态文件也由它返回（单一数据源，避免
    # Nginx 直读文件造成的 404/缓存不一致）。
    root __APP_DIR__/app/static;
    index index.html;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log /www/wwwlogs/__DOMAIN__.error.log;

    client_max_body_size 2m;
    client_body_timeout 60s;

    # 禁止访问隐藏文件（.git、.env 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查：不打访问日志，方便监控轮询
    location = /api/health {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # 求解失败/服务重启时给出可读错误，而不是空白页
        proxy_intercept_errors off;
    }

    # 静态资源：由 Python 服务返回，这里不做 expires，避免与 ETag 冲突。
    # 如果确实想让 Nginx 直接托管静态文件以省 CPU，请把下面这段取消注释，
    # 并把上面的 location / 保留——注意保持 root 指向 app/static。
    # location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    #     root __APP_DIR__/app/static;
    #     expires 10m;
    #     access_log off;
    # }
}
